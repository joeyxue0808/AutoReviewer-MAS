# AutoReviewer-MAS 全局配置 V2.0

# LLM 配置
llm:
  roles:
    reviewer:
      base_url: "https://api.mimo.com/v1"
      model: "mimo-v2.5-pro"
      api_key_env: "MIMO_API_KEY"
      temperature: 0.3
      max_tokens: 4096
    fixer:
      base_url: "https://api.mimo.com/v1"
      model: "mimo-v2.5-pro"
      api_key_env: "MIMO_API_KEY"
      temperature: 0.2
      max_tokens: 8192
    tester:
      base_url: "https://api.mimo.com/v1"
      model: "mimo-v2.5-pro"
      api_key_env: "MIMO_API_KEY"
      temperature: 0.1
      max_tokens: 2048

  retry:
    max_attempts: 5
    min_wait_seconds: 2
    max_wait_seconds: 10
    multiplier: 1

# 9-Language Sandbox Matrix (Blueprint V2 Section 2)
sandbox:
  default_engine: "docker"
  timeout: 300

  matrix:
    go:
      suffixes: [".go"]
      image: "golang:1.23-alpine"
      lint_command: "golangci-lint run"
      test_command: "go test ./..."

    python:
      suffixes: [".py"]
      image: "python:3.12-slim"
      lint_command: "ruff check ."
      test_command: "pytest"

    cpp:
      suffixes: [".cpp", ".h", ".cc", ".hpp"]
      image: "gcc:latest"
      lint_command: "cpplint"
      test_command: "cmake . && make && ctest"

    java:
      suffixes: [".java"]
      image: "maven:3.9-eclipse-temurin-21"
      lint_command: "checkstyle"
      test_command: "mvn test"

    vue:
      suffixes: [".vue"]
      image: "node:20-alpine"
      lint_command: "eslint --ext .vue src"
      test_command: "vitest run"

    javascript:
      suffixes: [".js", ".cjs", ".mjs"]
      image: "node:20-alpine"
      lint_command: "eslint ."
      test_command: "npm test"

    typescript:
      suffixes: [".ts", ".tsx"]
      image: "node:20-alpine"
      lint_command: "tsc --noEmit"
      test_command: "npm test"

    flutter:
      suffixes: [".dart"]
      image: "ghcr.io/cirruslabs/flutter:stable"
      lint_command: "dart analyze"
      test_command: "flutter test"

    csharp:
      suffixes: [".cs"]
      image: "mcr.microsoft.com/dotnet/sdk:8.0"
      lint_command: "dotnet format"
      test_command: "dotnet test"

# VCS 平台配置
gitlab:
  api_url: "https://gitlab.example.com/api/v4"
  token_env: "GITLAB_TOKEN"

github:
  api_url: "https://api.github.com"
  token_env: "GITHUB_TOKEN"

max_retry_count: 3

# Phase 1: 消息队列配置 (Redis Streams)
queue:
  redis_url: "redis://localhost:6379/0"
  stream_key: "mr_review_queue"
  consumer_group: "review_workers"
  consumer_name: "worker-1"
  max_len: 10000  # Stream 最大长度（防止内存溢出）

# Phase 1: LangGraph 持久化检查点 (Postgres)
checkpointer:
  enabled: true
  postgres_url: "postgresql://postgres:postgres@localhost:5432/autoreviewer"

# Phase 1: API 熔断器配置 (pybreaker)
circuit_breaker:
  enabled: true
  fail_max: 5        # 60 秒内连续失败 N 次触发熔断
  reset_timeout: 30  # 熔断后等待 N 秒进入半开状态
  exclude_exceptions:  # 这些异常不计入熔断计数
    - "ValueError"
    - "KeyError"
