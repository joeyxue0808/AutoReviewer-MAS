[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreviewer-mas"
version = "0.5.0"
description = "Multi-Agent System for Automated Code Review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn>=0.32.0,<1.0",
    "langchain>=1.3.0,<2.0",
    "langchain-openai>=1.2.0,<2.0",
    "langchain-core>=1.4.0,<2.0",
    "langgraph>=1.2.0,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "tenacity>=9.0,<10.0",
    "docker>=7.0,<8.0",
    "aiohttp>=3.10,<4.0",
    "redis>=5.0,<9.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "pybreaker>=1.0,<2.0",
    "psycopg[binary]>=3.1,<4.0",
    "tree-sitter>=0.22,<1.0",
    "typer>=0.12.0,<1.0",
    "rich>=13.0,<16.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
]
rag = [
    "lancedb>=0.17",
]
monitoring = [
    "langfuse>=2.0,<5.0",
]

[project.scripts]
auto-review = "app.cli.main:app"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]
